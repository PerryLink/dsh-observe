<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="t d">
<title id="t">dsh-observe delivery shape: the session/event capture spine forks into two independent backend pipelines — otlp and langfuse — that each queue, flush with retry, and post to their own endpoint, around one bounded storage-domain spool that both spill into and that drains back into both endpoints on a timer</title>
<desc id="d">Left column, capture: session/event boundary events feed the collector (turn, step, tool and llm spans; observe.tokens, observe.cost and observe.context_tokens metrics; deterministic sha256 ids), then sanitize (key redaction, five builtin secret patterns, prompt/completion 4000, tool 2000/2000, attributes 512) runs at capture, before any queue. The record then forks into two lanes. Each lane is a pipeline (queue 256 records or 5000ms, maxQueueRecords 2000) into flush and retry (maxAttempts 5, 1000ms x2 capped at 60000ms, deterministic backoff) into its wire endpoint: OTLP POST /v1/traces and /v1/metrics with service.name deepseek-harness, or Langfuse POST /api/public/ingestion with trace-create, span-create and generation-create under Basic auth. Retry-exhausted batches and queue overflow spill into the bounded storage-domain spool between the lanes (maxBufferRecords 10000, oldest-first eviction, zod re-validation on read, survives restart); a dashed return rail on the right drains it back into both endpoints every 30000ms. Bottom left is the optional remote surface, observe/status and observe/setEnabled. The bottom band states the flush, retry and drain cadence and the off-by-default contract.</desc>
