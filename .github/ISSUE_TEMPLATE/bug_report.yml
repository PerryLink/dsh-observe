name: Bug report
description: Report a bug in dsh-observe
title: '[Bug]: '
labels: ['bug']
body:
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: The dsh-observe version (`npm ls dsh-observe`, or the git ref you installed).
      placeholder: '0.1.0'
    validations:
      required: true
  - type: input
    id: harness-version
    attributes:
      label: Harness version
      description: The DeepSeek Harness version (`dsh --version`).
      placeholder: '0.1.0-rc.6'
    validations:
      required: true
  - type: input
    id: os-node
    attributes:
      label: OS and Node versions
      description: Operating system and Node.js version (`node --version`).
      placeholder: 'Windows 11, Node v22.22.3'
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Export backend
      description: Which backend(s) you configured.
      options:
        - OTLP
        - Langfuse
        - Both
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps that trigger the bug, including the relevant configuration keys.
      placeholder: |
        1. Mount dsh-observe with enabled: true and otlp.endpoint ...
        2. Run a turn with a tool call ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead (error messages, log lines).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: Relevant session excerpts or stack traces.
      value: |
        > **⚠️ Before pasting: redact everything sensitive.**
        > Logs must NOT contain tokens, API keys, secrets, Authorization or
        > other request headers, personal paths, or account identifiers.
    validations:
      required: false
