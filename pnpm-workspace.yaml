packages:
  - .

nodeLinker: hoisted
onlyBuiltDependencies:
  - esbuild
# The 0.1.1-rc.2 @deepseek-ai family was published inside the registry's
# minimum-release-age window; exclude the whole scope so installs resolve.
minimumReleaseAgeExclude:
  - '@deepseek-ai/*'
allowBuilds:
  esbuild: true
verifyDepsBeforeRun: false
